# ============================================
# PT (Promptivity) — Docker Compose
# Local Development / Local Production Test
# ============================================

version: "3.9"

services:
  promptivity:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptivity
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
