# ============================================
# PT — Docker Compose DEVELOPMENT
# Usage: docker compose -f docker-compose.dev.yml up
# Hot reload aktif untuk keduanya
# ============================================

version: '3.9'

services:

  frontend:
    build:
      context: ./pt-frontend
      dockerfile: Dockerfile.dev
    container_name: pt-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./pt-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev
    networks:
      - pt-dev-network

  backend:
    build:
      context: ./pt-backend
      dockerfile: Dockerfile
    container_name: pt-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./pt-backend:/app
    environment:
      - APP_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - pt-dev-network

networks:
  pt-dev-network:
    driver: bridge
